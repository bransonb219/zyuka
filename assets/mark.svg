<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Zyuka mark">
  <title>Zyuka</title>
  <desc>Dawn arc cradling a rising seed — awakening, protection, growth.</desc>
  <!-- Indigo embrace: ~300° thick arc with rounded caps, open at the top -->
  <path d="M 172,64 A 84,84 0 1 1 84,64"
        fill="none" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round"/>
  <!-- Green seed cradled in the gap -->
  <circle cx="128" cy="70" r="26" fill="#198A48"/>
</svg>
