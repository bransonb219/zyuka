<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" role="img" aria-label="Zyuka">
  <title>Zyuka</title>
  <desc>Zyuka wordmark with the dawn-arc mark.</desc>
  <!-- Mark scaled to ~100x100 at (10,10) -->
  <g transform="translate(10,10) scale(0.390625)">
    <path d="M 172,64 A 84,84 0 1 1 84,64"
          fill="none" stroke="#1E3A8A" stroke-width="34" stroke-linecap="round"/>
    <circle cx="128" cy="70" r="26" fill="#198A48"/>
  </g>
  <!-- Wordmark -->
  <text x="130" y="82"
        font-family="'Inter','Helvetica Neue',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="68" font-weight="700" fill="#1E3A8A" letter-spacing="-1.5">zyuka</text>
</svg>
