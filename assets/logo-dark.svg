<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" role="img" aria-label="Zyuka">
  <title>Zyuka</title>
  <desc>Dark-mode wordmark: brighter teal arc and wordmark for contrast on dark backgrounds.</desc>
  <defs>
    <linearGradient id="arcGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="seedGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="seedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7"/>
    </filter>
    <linearGradient id="textGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,10) scale(0.390625)">
    <g transform="rotate(28 128 128)">
      <path d="M 172,62 A 84,84 0 1 1 84,62"
            fill="none" stroke="url(#arcGrad)" stroke-width="34" stroke-linecap="round"/>
      <circle cx="128" cy="66" r="38" fill="#FCD34D" opacity="0.55" filter="url(#seedGlow)"/>
      <circle cx="128" cy="66" r="30" fill="url(#seedGrad)"/>
    </g>
  </g>
  <text x="130" y="82"
        font-family="'Inter','Helvetica Neue',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
        font-size="68" font-weight="700" fill="url(#textGrad)" letter-spacing="-1.5">zyuka</text>
</svg>
