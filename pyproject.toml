[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linga-me"
version = "0.1.0"
description = "Privacy-first, local M&E toolkit for NGOs, government programmes and researchers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Branson Bazungu", email = "bbazungu@gmail.com" }]
maintainers = [{ name = "Branson Bazungu", email = "bbazungu@gmail.com" }]
keywords = ["monitoring", "evaluation", "privacy", "survey", "kobo", "odk", "zambia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.32",
    "cryptography>=42.0",
    "Jinja2>=3.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "Faker>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]

[project.scripts]
linga = "linga.cli:app"

[project.urls]
Homepage = "https://github.com/bbazungu/linga"
Issues = "https://github.com/bbazungu/linga/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/linga"]

[tool.hatch.build.targets.wheel.force-include]
"src/linga/data" = "linga/data"
"src/linga/reports/templates" = "linga/reports/templates"
"src/linga/compliance/templates" = "linga/compliance/templates"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "linga-demo", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["linga"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pandas.*", "matplotlib.*", "openpyxl.*", "streamlit.*", "faker.*", "yaml.*"]
ignore_missing_imports = true

# Command stubs lazily import modules that land in later milestones. These
# overrides are removed as each milestone fills in its module.
[[tool.mypy.overrides]]
module = [
    "linga.rights.subject",
    "linga.rights.retention",
    "linga.compliance.dpia",
    "linga.compliance.consent",
]
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
]

[tool.coverage.run]
branch = true
source = ["linga"]
omit = ["src/linga/gui/*", "src/linga/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 0

[tool.bandit]
exclude_dirs = ["tests", ".venv", "linga-demo"]

[tool.pip-audit]
# linga-me is the local package itself; no upstream advisory to check.
# We ignore the unknown-package error rather than skip-editable, which would
# miss sub-deps of editable installs.

